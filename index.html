<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=League+Spartan:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a26;
            --accent-primary: #c9a961;
            --accent-secondary: #8b7355;
            --text-primary: #e8e8f0;
            --text-secondary: #9a9aaa;
            --text-muted: #5a5a6a;
            --border-subtle: #2a2a38;
            --online-green: #4ecca3;
            --message-sent: #1e1e2e;
            --message-received: #242435;
            --ai-message: #2a1f3d;
            --ai-accent: #9b59b6;
        }

        body {
            font-family: 'League Spartan', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(201, 169, 97, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(78, 204, 163, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Login Screen */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 48px;
            width: 400px;
            max-width: 90%;
        }

        .login-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 42px;
            font-weight: 300;
            text-align: center;
            margin-bottom: 32px;
            background: linear-gradient(135deg, var(--accent-primary), var(--text-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-input {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 14px 18px;
            color: var(--text-primary);
            font-family: 'League Spartan', sans-serif;
            font-size: 15px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .login-button {
            width: 100%;
            background: var(--accent-primary);
            color: var(--bg-primary);
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-family: 'League Spartan', sans-serif;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .login-button:hover {
            background: var(--accent-secondary);
            transform: translateY(-1px);
        }

        .app-container {
            display: grid;
            grid-template-columns: 340px 1fr;
            height: 100vh;
            position: relative;
            z-index: 1;
            display: none;
        }

        .app-container.visible {
            display: grid;
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .sidebar-header {
            padding: 32px 24px 24px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .app-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent-primary), var(--text-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--online-green);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
        }

        .search-box {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .search-input {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-family: 'League Spartan', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-secondary);
            background: var(--bg-primary);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        /* Contacts List */
        .contacts-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .contacts-list::-webkit-scrollbar {
            width: 6px;
        }

        .contacts-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .contacts-list::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 3px;
        }

        .contact-item {
            padding: 16px 24px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .contact-item:hover {
            background: var(--bg-tertiary);
        }

        .contact-item.active {
            background: var(--bg-tertiary);
            border-left-color: var(--accent-primary);
        }

        .contact-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 500;
            color: var(--bg-primary);
            position: relative;
            flex-shrink: 0;
        }

        .contact-avatar.ai {
            background: linear-gradient(135deg, var(--ai-accent), var(--accent-primary));
        }

        .contact-avatar.online::after {
            content: '';
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: var(--online-green);
            border: 2px solid var(--bg-secondary);
            border-radius: 50%;
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .contact-preview {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .contact-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Chat Area */
        .chat-area {
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            height: 100vh; /* Fix: forza altezza piena */
            overflow: hidden; /* Previene scroll su chat-area */
        }

        .chat-header {
            padding: 24px 32px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-secondary);
        }

        .chat-user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .chat-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 500;
            color: var(--bg-primary);
        }

        .chat-avatar.ai {
            background: linear-gradient(135deg, var(--ai-accent), var(--accent-primary));
        }

        .chat-user-details h2 {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .chat-user-status {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .typing-indicator {
            color: var(--accent-primary);
            font-style: italic;
        }

        /* Messages Container */
        .messages-container {
            flex: 1 1 auto;
            overflow-y: scroll; /* Forza scroll sempre */
            overflow-x: hidden;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 0;
            max-height: 100%;
            -webkit-overflow-scrolling: touch;
        }

        .messages-container::-webkit-scrollbar {
            width: 8px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 4px;
        }
        
        .messages-container::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .message {
            display: flex;
            gap: 12px;
            animation: messageSlide 0.3s ease;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--bg-primary);
            flex-shrink: 0;
        }

        .message-avatar.ai {
            background: linear-gradient(135deg, var(--ai-accent), var(--accent-primary));
        }

        .message-content {
            max-width: 65%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message.sent .message-content {
            align-items: flex-end;
        }

        .message-sender {
            font-size: 12px;
            color: var(--text-muted);
            padding: 0 8px;
        }

        .message-bubble {
            background: var(--message-received);
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            border: 1px solid var(--border-subtle);
        }

        .message.sent .message-bubble {
            background: var(--message-sent);
            border: 1px solid var(--accent-secondary);
        }

        .message.ai .message-bubble {
            background: var(--ai-message);
            border: 1px solid var(--ai-accent);
        }

        .message-time {
            font-size: 11px;
            color: var(--text-muted);
            padding: 0 8px;
        }

        .date-divider {
            text-align: center;
            margin: 24px 0;
            position: relative;
        }

        .date-divider span {
            background: var(--bg-primary);
            padding: 6px 16px;
            font-size: 12px;
            color: var(--text-muted);
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            position: relative;
            z-index: 1;
        }

        /* Input Area */
        .input-area {
            padding: 24px 32px;
            border-top: 1px solid var(--border-subtle);
            background: var(--bg-secondary);
        }

        .input-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 4px 4px 4px 20px;
            border: 1px solid var(--border-subtle);
            transition: all 0.3s ease;
        }

        .input-container:focus-within {
            border-color: var(--accent-secondary);
        }

        .message-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: 'League Spartan', sans-serif;
            font-size: 15px;
            padding: 14px 0;
            outline: none;
        }

        .message-input::placeholder {
            color: var(--text-muted);
        }

        .send-button {
            background: var(--accent-primary);
            color: var(--bg-primary);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 18px;
        }

        .send-button:hover {
            background: var(--accent-secondary);
            transform: translateY(-1px);
        }

        .send-button:active {
            transform: translateY(0);
        }

        .send-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-family: 'Cormorant Garamond', serif;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state-text {
            font-size: 20px;
            font-weight: 300;
        }

        /* Mention styling */
        .mention {
            color: var(--ai-accent);
            font-weight: 500;
        }

        /* Mobile Menu Button */
        .mobile-menu-btn {
            display: none;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
            padding: 12px 16px;
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            min-width: 48px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .mobile-menu-btn:active {
            background: var(--bg-primary);
        }
        
        /* Desktop - nasconde il pulsante menu */
        @media (min-width: 769px) {
            .mobile-menu-btn {
                display: none !important;
            }
        }

        /* Mobile Overlay */
        .mobile-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 999;
        }

        .mobile-overlay.visible {
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
            }

            .mobile-menu-btn {
                display: flex !important; /* Forza visualizzazione su mobile */
            }

            .chat-header {
                padding-left: 80px; /* Più spazio per il pulsante grande */
            }

            .sidebar {
                display: none;
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: 85%;
                max-width: 320px;
                z-index: 1000;
                box-shadow: 2px 0 12px rgba(0,0,0,0.4);
            }

            .sidebar.mobile-visible {
                display: flex;
            }

            .chat-area {
                width: 100%;
                height: 100vh;
            }

            .messages-container {
                padding: 16px;
            }

            .message-bubble {
                max-width: 85%;
                font-size: 15px;
            }

            .input-area {
                padding: 12px;
            }

            .login-card {
                width: 90%;
                max-width: 400px;
                padding: 32px 24px;
            }

            .login-input, .message-input {
                font-size: 16px; /* Previene zoom su iOS */
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <h1 class="login-title">Chill Chat</h1>
            
            <!-- Login Form -->
            <div id="loginForm">
                <input type="email" id="emailInput" class="login-input" placeholder="Email" autocomplete="email" />
                <input type="password" id="passwordInput" class="login-input" placeholder="Password" autocomplete="current-password" />
                <button class="login-button" onclick="loginUser()">Accedi</button>
                <div style="text-align: center; margin-top: 16px; color: var(--text-secondary); font-size: 14px;">
                    Non hai un account? 
                    <a href="#" onclick="showRegister(); return false;" style="color: var(--accent-primary); text-decoration: none;">Registrati</a>
                </div>
            </div>
            
            <!-- Register Form -->
            <div id="registerForm" style="display: none;">
                <input type="text" id="regNameInput" class="login-input" placeholder="Nome" />
                <input type="email" id="regEmailInput" class="login-input" placeholder="Email" autocomplete="email" />
                <input type="password" id="regPasswordInput" class="login-input" placeholder="Password (min 6 caratteri)" autocomplete="new-password" />
                <button class="login-button" onclick="registerUser()">Registrati</button>
                <div style="text-align: center; margin-top: 16px; color: var(--text-secondary); font-size: 14px;">
                    Hai già un account? 
                    <a href="#" onclick="showLogin(); return false;" style="color: var(--accent-primary); text-decoration: none;">Accedi</a>
                </div>
            </div>
            
            <!-- Error Message -->
            <div id="authError" style="display: none; margin-top: 16px; padding: 12px; background: rgba(255,0,0,0.1); border: 1px solid rgba(255,0,0,0.3); border-radius: 8px; color: #ff6b6b; font-size: 13px; text-align: center;"></div>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <!-- Mobile Overlay -->
        <div class="mobile-overlay" id="mobileOverlay" onclick="toggleMobileSidebar()"></div>
        
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1 class="app-title">Chill Chat</h1>
                <div class="user-info">
                    <div class="user-status">
                        <span class="status-dot"></span>
                        <span id="currentUserName">Utente</span>
                    </div>
                    <button class="logout-btn" onclick="logout()">Esci</button>
                </div>
            </div>

            <div class="search-box">
                <input type="text" class="search-input" placeholder="Cerca conversazioni..." id="searchInput">
            </div>

            <div class="contacts-list" id="contactsList">
                <!-- Contacts will be populated by JavaScript -->
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <button class="mobile-menu-btn" onclick="toggleMobileSidebar()" title="Menu">
                    ☰
                </button>
                <h1 id="chatHeaderTitle" style="font-size: 20px; font-weight: 600; color: var(--text-primary); margin: 0; flex: 1;">Chill Chat</h1>
                <div class="chat-user-info" id="chatUserInfo" style="display: none;">
                    <div class="chat-avatar" id="chatAvatar">C</div>
                    <div class="chat-user-details">
                        <h2 id="chatUserName">Conversina</h2>
                        <div class="chat-user-status">
                            <span class="status-dot"></span>
                            <span id="chatUserStatus">Online</span>
                        </div>
                    </div>
                </div>
                <button class="logout-btn" onclick="if(window.reloadMessages) window.reloadMessages()" title="Ricarica messaggi">
                    🔄
                </button>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <div class="empty-state-text">Seleziona una conversazione per iniziare</div>
                </div>
            </div>

            <div class="input-area" id="inputArea" style="display: none;">
                <div class="input-container">
                    <input type="text" class="message-input" id="messageInput" placeholder="Scrivi un messaggio...">
                    <button class="send-button" id="sendButton" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK v8 (compat mode) from cdnjs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-auth.js"></script>

    <script>
        // Global variables
        let currentUser = null;
        let activeChat = null;
        let unsubscribeMessages = null;
        let db = null;
        let auth = null;
        
        const CONVERSINA_ID = 'conversina_ai_bot';

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCp2SjlW-JX9FeW1csVslhJm4qW51kzSKg",
            authDomain: "chill-chat-4945d.firebaseapp.com",
            projectId: "chill-chat-4945d",
            storageBucket: "chill-chat-4945d.firebasestorage.app",
            messagingSenderId: "803118071656",
            appId: "1:803118071656:web:90708d615b96cdfd31e0dd"
        };

        // Initialize Firebase immediately
        try {
            console.log('🔄 Inizializzazione Firebase...');
            firebase.initializeApp(firebaseConfig);
            console.log('✅ Firebase App inizializzato');
            
            db = firebase.firestore();
            
            // Initialize Firebase Auth
            auth = firebase.auth();
            console.log('✅ Firebase Auth inizializzato');
            
            // Disable network persistence to avoid WebChannel issues in restricted environments
            db.settings({
                cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED
            });
            
            console.log('✅ Firestore inizializzato');
            
            // Test connection
            db.collection('_test_').doc('test').set({ test: true })
                .then(() => {
                    console.log('✅ Connessione Firestore OK!');
                })
                .catch((error) => {
                    console.error('❌ Errore test connessione:', error);
                    console.log('💡 L\'app funziona comunque - i dati vengono salvati');
                });
                
        } catch (error) {
            console.error('❌ Errore nell\'inizializzazione di Firebase:', error);
            alert('Errore nell\'inizializzazione di Firebase. Controlla la console per dettagli.');
        }

        // Auth state observer
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // Utente loggato - carica i dati
                try {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    const userData = userDoc.data();
                    
                    currentUser = {
                        id: user.uid,
                        name: userData?.name || user.email.split('@')[0],
                        email: user.email,
                        avatar: (userData?.name || user.email)[0].toUpperCase()
                    };
                    
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('appContainer').classList.add('visible');
                    document.getElementById('currentUserName').textContent = currentUser.name;
                    
                    loadChats();
                } catch (error) {
                    console.error('Errore caricamento utente:', error);
                }
            } else {
                // Utente non loggato
                currentUser = null;
                activeChat = null;
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('appContainer').classList.remove('visible');
            }
        });

        // Show/hide forms
        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('authError').style.display = 'none';
        }

        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('authError').style.display = 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('authError');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // Login con email/password
        async function loginUser() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            
            if (!email || !password) {
                showError('Inserisci email e password');
                return;
            }
            
            try {
                await auth.signInWithEmailAndPassword(email, password);
                // L'app si caricherà automaticamente tramite onAuthStateChanged
            } catch (error) {
                console.error('Errore login:', error);
                if (error.code === 'auth/user-not-found') {
                    showError('Utente non trovato');
                } else if (error.code === 'auth/wrong-password') {
                    showError('Password errata');
                } else if (error.code === 'auth/invalid-email') {
                    showError('Email non valida');
                } else if (error.code === 'auth/invalid-credential') {
                    showError('Credenziali non valide');
                } else {
                    showError('Errore durante il login');
                }
            }
        }

        // Registrazione nuovo utente
        async function registerUser() {
            const name = document.getElementById('regNameInput').value.trim();
            const email = document.getElementById('regEmailInput').value.trim();
            const password = document.getElementById('regPasswordInput').value;
            
            if (!name) {
                showError('Inserisci il tuo nome');
                return;
            }
            if (!email) {
                showError('Inserisci una email');
                return;
            }
            if (password.length < 6) {
                showError('La password deve essere di almeno 6 caratteri');
                return;
            }
            
            try {
                // Crea utente
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                
                // Salva nome in Firestore
                await db.collection('users').doc(userCredential.user.uid).set({
                    name: name,
                    email: email,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                // L'app si caricherà automaticamente tramite onAuthStateChanged
            } catch (error) {
                console.error('Errore registrazione:', error);
                if (error.code === 'auth/email-already-in-use') {
                    showError('Email già registrata');
                } else if (error.code === 'auth/invalid-email') {
                    showError('Email non valida');
                } else if (error.code === 'auth/weak-password') {
                    showError('Password troppo debole');
                } else {
                    showError('Errore durante la registrazione');
                }
            }
        }

        // Logout function
        function logout() {
            if (unsubscribeMessages) {
                unsubscribeMessages();
            }
            auth.signOut();
        }

        // Toggle mobile sidebar
        function toggleMobileSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('mobileOverlay');
            
            sidebar.classList.toggle('mobile-visible');
            overlay.classList.toggle('visible');
        }

        // Wrapper per selectChat che chiude sidebar su mobile
        function selectChatMobile(chatId, name, avatar, isAI) {
            selectChat(chatId, name, avatar, isAI);
            // Close sidebar on mobile after selecting chat
            if (window.innerWidth <= 768) {
                const sidebar = document.querySelector('.sidebar');
                const overlay = document.getElementById('mobileOverlay');
                sidebar.classList.remove('mobile-visible');
                overlay.classList.remove('visible');
            }
        }

        // Load all chats
        function loadChats() {
            const contactsList = document.getElementById('contactsList');
            
            // Always show Conversina first
            const conversinaHTML = `
                <div class="contact-item" onclick="selectChatMobile('${CONVERSINA_ID}', 'Conversina', 'C', true)">
                    <div class="contact-avatar ai online">🤖</div>
                    <div class="contact-info">
                        <div class="contact-name">Conversina AI</div>
                        <div class="contact-preview">Il tuo assistente AI personale</div>
                    </div>
                    <div class="contact-meta">
                        <div class="contact-time">Sempre online</div>
                    </div>
                </div>
            `;

            contactsList.innerHTML = conversinaHTML;
        }

        // Select chat
        function selectChat(chatId, name, avatar, isAI = false) {
            activeChat = {
                id: chatId,
                name: name,
                avatar: avatar,
                isAI: isAI
            };

            // Update UI
            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('chatHeaderTitle').style.display = 'none';
            document.getElementById('chatUserInfo').style.display = 'flex';
            document.getElementById('inputArea').style.display = 'block';
            const chatAvatar = document.getElementById('chatAvatar');
            chatAvatar.textContent = isAI ? '🤖' : avatar;
            if (isAI) chatAvatar.classList.add('ai');
            else chatAvatar.classList.remove('ai');
            document.getElementById('chatUserName').textContent = name;

            // Update active state
            document.querySelectorAll('.contact-item').forEach(item => {
                item.classList.remove('active');
            });
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }

            // Load messages
            loadMessages(chatId);

            // Focus input
            document.getElementById('messageInput').focus();
        }

        // Load messages from Firestore
        function loadMessages(chatId) {
            console.log('📨 Caricamento messaggi per chat:', chatId);
            const messagesContainer = document.getElementById('messagesContainer');
            
            // Unsubscribe from previous chat
            if (unsubscribeMessages) {
                unsubscribeMessages();
            }

            // Create chat room ID (sorted to ensure consistency)
            const roomId = [currentUser.id, chatId].sort().join('_');
            console.log('🔑 Room ID:', roomId);

            // Funzione per caricare i messaggi
            window.reloadMessages = async function() {
                try {
                    const snapshot = await db.collection('messages')
                        .where('roomId', '==', roomId)
                        .orderBy('timestamp', 'asc')
                        .get();
                    
                    console.log('📬 Messaggi ricevuti:', snapshot.size);
                    const messages = [];
                    snapshot.forEach((doc) => {
                        messages.push({ id: doc.id, ...doc.data() });
                    });

                    renderMessages(messages);
                } catch (error) {
                    console.error('❌ Errore nel caricamento messaggi:', error);
                }
            }

            // Carica subito
            window.reloadMessages();

            // POLLING DISABILITATO - Ricarica solo manuale o dopo invio messaggi
            // Per ricaricare manualmente: premi F5 o invia un messaggio
            
            // Cleanup function (vuota ma necessaria)
            unsubscribeMessages = () => {
                // Nessun interval da cancellare
            };
        }

        // Render messages
        function renderMessages(messages) {
            const messagesContainer = document.getElementById('messagesContainer');
            
            // Salva la posizione di scroll corrente
            const wasAtBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop <= messagesContainer.clientHeight + 100;
            
            if (messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="date-divider">
                        <span>Oggi</span>
                    </div>
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <div class="empty-state-text">Inizia una conversazione!</div>
                    </div>
                `;
                return;
            }

            const messagesHTML = messages.map(msg => {
                const isSent = msg.senderId === currentUser.id;
                const isAI = msg.senderId === CONVERSINA_ID;
                const time = msg.timestamp ? new Date(msg.timestamp.seconds * 1000).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) : 'Ora';
                
                return `
                    <div class="message ${isSent ? 'sent' : 'received'} ${isAI ? 'ai' : ''}">
                        <div class="message-avatar ${isAI ? 'ai' : ''}">${isSent ? currentUser.avatar : (isAI ? '🤖' : msg.senderAvatar)}</div>
                        <div class="message-content">
                            ${!isSent ? `<div class="message-sender">${msg.senderName}</div>` : ''}
                            <div class="message-bubble">${formatMessage(msg.text)}</div>
                            <div class="message-time">${time}</div>
                        </div>
                    </div>
                `;
            }).join('');

            messagesContainer.innerHTML = `
                <div class="date-divider">
                    <span>Oggi</span>
                </div>
                ${messagesHTML}
            `;

            // Scroll solo se eri già in fondo (nuovo messaggio)
            if (wasAtBottom) {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }

        // Format message (highlight mentions)
        function formatMessage(text) {
            return text.replace(/@conversina/gi, '<span class="mention">@Conversina</span>');
        }

        // Send message
        async function sendMessage() {
            console.log('📤 Tentativo invio messaggio...');
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text || !activeChat) {
                console.log('⚠️ Messaggio vuoto o chat non selezionata');
                return;
            }
            
            if (!db) {
                alert('Database non ancora inizializzato. Riprova tra un momento.');
                console.error('❌ DB non inizializzato');
                return;
            }

            const roomId = [currentUser.id, activeChat.id].sort().join('_');
            console.log('🔑 Invio a room:', roomId);

            try {
                // Add message to Firestore
                console.log('💾 Salvataggio messaggio su Firestore...');
                await db.collection('messages').add({
                    roomId: roomId,
                    senderId: currentUser.id,
                    senderName: currentUser.name,
                    senderAvatar: currentUser.avatar,
                    text: text,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                console.log('✅ Messaggio salvato!');
                
                // Clear input
                input.value = '';
                
                // Ricarica i messaggi immediatamente
                if (window.reloadMessages) {
                    setTimeout(window.reloadMessages, 500);
                }

                // If chatting with Conversina or mentioned her, get AI response
                if (activeChat.id === CONVERSINA_ID || text.toLowerCase().includes('@conversina')) {
                    console.log('🤖 Chiamata a Conversina...');
                    await getConversinaResponse(text, roomId);
                }

            } catch (error) {
                console.error('❌ Errore nell\'invio del messaggio:', error);
                alert('Errore nell\'invio del messaggio: ' + error.message);
            }
        }

        // Get response from Conversina (via backend API)
        async function getConversinaResponse(userMessage, roomId) {
            // Show typing indicator
            const statusElement = document.getElementById('chatUserStatus');
            const originalStatus = statusElement.innerHTML;
            statusElement.innerHTML = '<span class="typing-indicator">Sta scrivendo...</span>';

            try {
                // Get conversation history
                const historySnapshot = await db.collection('messages')
                    .where('roomId', '==', roomId)
                    .orderBy('timestamp', 'asc')
                    .get();
                
                // Build conversation history
                const history = [];
                historySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const role = data.senderId === currentUser.id ? 'Utente' : 'Conversina';
                    history.push(`${role}: ${data.text}`);
                });

                console.log('🤖 Chiamando backend API...');
                
                // Backend URL - Sostituito con il tuo deployment Vercel
                const BACKEND_URL = 'https://conversina-backend-ijue.vercel.app/api/chat';
                
                // Call backend API
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: userMessage,
                        history: history.slice(-10) // Send last 10 messages for context
                    })
                });

                console.log('📡 Risposta API status:', response.status);
                const data = await response.json();
                console.log('📦 Dati ricevuti:', data);

                if (!response.ok) {
                    throw new Error('Errore backend: ' + (data.error || response.statusText));
                }

                const aiText = data.response || 'Mi dispiace, non sono riuscita a generare una risposta.';

                console.log('💬 Risposta AI:', aiText.substring(0, 50) + '...');

                // Add AI response to Firestore
                console.log('💾 Salvando risposta AI...');
                await db.collection('messages').add({
                    roomId: roomId,
                    senderId: CONVERSINA_ID,
                    senderName: 'Conversina',
                    senderAvatar: '🤖',
                    text: aiText,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                console.log('✅ Risposta AI salvata!');
                
                // Ricarica i messaggi per mostrare la risposta di Conversina
                if (window.reloadMessages) {
                    setTimeout(window.reloadMessages, 500);
                }

            } catch (error) {
                console.error('❌ Errore nella risposta di Conversina:', error);
                // Invia un messaggio di errore
                await db.collection('messages').add({
                    roomId: roomId,
                    senderId: CONVERSINA_ID,
                    senderName: 'Conversina',
                    senderAvatar: '🤖',
                    text: '⚠️ Backend non configurato! Segui le istruzioni in SETUP_BACKEND.md per attivare Conversina. Per ora l\'app funziona solo per chat tra utenti.',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            } finally {
                // Remove typing indicator
                statusElement.innerHTML = originalStatus;
            }
        }

        // Event listeners
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
